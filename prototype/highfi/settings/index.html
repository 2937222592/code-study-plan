<div class="page-head"><h1>系统设置</h1><p>站点信息、学习计划默认值、AI 模型与限额（保存后全局生效）</p></div>
<div class="card" style="margin-bottom:14px;">
  <h3>站点信息</h3>
  <div class="form-grid" style="margin-top:12px;">
    <div><label class="label">站点名称</label><input class="input" value="TechPath 学习陪跑平台"></div>
    <div><label class="label">站点描述</label><input class="input" value="面向编程初学者的学习路线 · 课件 · AI 助教"></div>
  </div>
</div>
<div class="card" style="margin-bottom:14px;">
  <h3>学习计划默认值</h3>
  <div class="form-grid" style="margin-top:12px;">
    <div><label class="label">默认每日学习时长（分钟）</label><input class="input" type="number" value="60"></div>
    <div><label class="label">未完成任务顺延</label><div class="seg"><button class="on">自动顺延</button><button>不顺延</button></div></div>
  </div>
</div>
<div class="card" style="margin-bottom:14px;">
  <h3>AI 模型与限额（LangChain 服务）</h3>
  <div class="form-grid" style="margin-top:12px;">
    <div><label class="label">模型</label><div class="seg"><button class="on">deepseek-chat</button><button>deepseek-reasoner</button><button>gpt-4o-mini</button></div></div>
    <div><label class="label">API Key（加密存储，不回显）</label><input class="input" type="password" value="sk-****************"></div>
    <div><label class="label">每用户每日 AI 调用上限</label><input class="input" type="number" value="20"></div>
    <div><label class="label">开发模式</label><div class="seg"><button class="on">真实 API</button><button>Mock 模式</button></div></div>
  </div>
  <div class="row" style="margin-top:14px;"><span class="badge blue">LangChain</span><span class="muted" style="font-size:12.5px;">AI 调用统一收敛在 ai_service 模块 · 修改后立即生效</span></div>
</div>
<div class="card">
  <h3>内容与合规</h3>
  <div class="form-grid" style="margin-top:12px;">
    <div><label class="label">课件投诉处理时限（小时）</label><input class="input" type="number" value="24"></div>
    <div><label class="label">讨论区敏感词过滤</label><div class="row"><div class="switch on"></div><span class="muted" style="font-size:13px;">启用（自动拦截并提示）</span></div></div>
  </div>
</div>
<div class="row" style="margin-top:16px;justify-content:flex-end;"><button class="btn primary">保存设置</button></div>
    </div>
  </div>
</div>
