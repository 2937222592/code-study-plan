</head>

<div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="grid"></div></div>
<div class="wf-tip">🎨 高保真 · <b>角色编辑</b></div>
<div class="admin">
  <aside class="side">
    <div class="logo"><span style="font-size:20px;">🧭</span> Tech<em>Path</em></div>
    <a class="nav-item" href="../dashboard/index.html">📊 数据概览</a>
    <a class="nav-item" href="../content/index.html">🗂 内容管理</a>

    <a class="nav-item" href="../complaints/index.html">🚩 课件投诉 <span class="cnt">1</span></a>
    <div class="grp">系统管理</div>
    <a class="nav-item" href="../users/index.html">👥 用户管理</a>
    <a class="nav-item on" href="../roles/index.html">🛡️ 角色管理</a>
    <a class="nav-item" href="../menus/index.html">📑 菜单管理</a>
    <a class="nav-item" href="../settings/index.html">⚙️ 系统设置</a>
    <a class="nav-item" href="../logs/index.html">🧾 操作日志</a>
    <a href="../index.html" style="display:block;padding:10px 12px;font-size:12.5px;color:var(--text-faint);">← 高保真目录</a>
    <div class="foot">
      <div class="avatar">管</div>
      <div><b style="font-size:13px;">管理员</b><br><span class="faint" style="font-size:11px;">admin@techpath.cn</span></div>
      <span style="margin-left:auto;cursor:pointer;color:var(--text-faint);">⎋</span>
    </div>
</aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb">系统管理 / 角色管理 / <b>角色编辑</b></div>
      <div style="margin-left:auto;" class="row"><a class="btn ghost sm" href="index.html">← 返回列表</a><div class="avatar">管</div></div>
    </header>
    <div class="content">
<div class="page-head"><h1>编辑角色 <span class="badge gray">内容管理员</span></h1><p>基础信息 + 权限配置（勾选模块与操作）</p></div>
<div class="card">
  <div class="form-grid">
    <div><label class="label">角色名称</label><input class="input" value="内容管理员"></div>
    <div><label class="label">角色标识</label><input class="input" value="content_admin"></div>
    <div><label class="label">状态</label><div class="row"><div class="switch on"></div><span class="muted" style="font-size:13px;">启用</span></div></div>
    <div><label class="label">备注</label><input class="input" value="负责内容与课件管理"></div>
  </div>
</div>
<div class="card" style="margin-top:14px;">
  <div class="spread"><h3>权限配置</h3><span class="badge gray">勾选可访问的模块与操作</span></div>
  <div style="margin-top:12px;display:grid;gap:6px;font-size:13.5px;">
    <div><label><input type="checkbox" checked> 数据概览</label></div>
    <div><label><input type="checkbox" checked> 内容管理</label>
      <div style="padding-left:26px;color:var(--text-dim);font-size:13px;">
        <label><input type="checkbox" checked> 查看</label> <label><input type="checkbox" checked> 新增</label> <label><input type="checkbox" checked> 编辑</label> <label><input type="checkbox"> 删除</label>
      </div>
    </div>
    <div><label><input type="checkbox" checked> 课件管理</label>
      <div style="padding-left:26px;color:var(--text-dim);font-size:13px;">
        <label><input type="checkbox" checked> 查看</label> <label><input type="checkbox" checked> 编辑</label> <label><input type="checkbox" checked> 导入</label>
      </div>
    </div>
    <div><label><input type="checkbox" checked> 讨论区管理</label></div>
    <div><label><input type="checkbox" checked> 课件投诉</label></div>
    <div><label><input type="checkbox"> 系统管理</label>
      <div style="padding-left:26px;color:var(--text-dim);font-size:13px;">
        <label><input type="checkbox"> 用户管理</label> <label><input type="checkbox"> 角色管理</label> <label><input type="checkbox"> 菜单管理</label> <label><input type="checkbox"> 系统设置</label> <label><input type="checkbox"> 操作日志</label>
      </div>
    </div>
  </div>
</div>
<div class="row" style="margin-top:16px;justify-content:flex-end;"><a class="btn ghost" href="index.html">取消</a><button class="btn primary">保存角色</button></div>
    </div>
  </div>
</div>
</body>
</html>
