<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="bg"><div class="blob a"></div><div class="blob b"></div><div class="grid"></div></div>
<div class="wf-tip">🎨 高保真 · <b>登录</b> · <a href="../index.html" style="color:#4a5a82;">← 返回目录</a></div>
<div class="auth-wrap">
  <div class="auth-brand">
    <div class="logo"><span style="font-size:26px;">🧭</span> Tech<em>Path</em></div>
    <h1>把学习变成<br>看得见的<span class="grad">成长</span></h1>
    <p>为编程初学者打造的「学习陪跑系统」——路线、计划、精选资料、课件互动，还有随时在身边的 AI 助教。</p>
    <div class="auth-feats">
      <div class="auth-feat"><div class="ic">🗺</div><div><b>确定的学习路线</b><br><span>AI 应用开发 · 7 阶段 · 37 技能</span></div></div>
      <div class="auth-feat"><div class="ic">📚</div><div><b>课件 + 笔记 + 讨论</b><br><span>看视频配课件，标注笔记，章节内交流</span></div></div>
      <div class="auth-feat"><div class="ic">🤖</div><div><b>AI 学习助教</b><br><span>知道你在学什么，卡住随时问</span></div></div>
    </div>
  </div>
  <div class="card auth-card">
    <h3 style="font-size:20px;margin-bottom:20px;">登录 TechPath</h3>
    <div class="field"><div class="label">邮箱</div><input class="input" type="email" placeholder="you@example.com" value="demo@techpath.cn"></div>
    <div class="field">
      <div class="label-row"><span class="label" style="margin:0;">密码</span><a class="link muted" href="forgot.html">忘记密码？</a></div>
      <div class="pwd"><input class="input" type="password" placeholder="输入密码" value="12345678"><span class="eye">👁</span></div>
    </div>
    <div class="agree" style="margin-bottom:18px;"><input type="checkbox" checked> <span>保持登录状态</span></div>
    <a class="btn primary block" href="../dashboard/index.html">登 录</a>
    <p class="muted" style="font-size:12.5px;text-align:center;margin-top:16px;">还没有账号？<a href="register.html">去注册</a></p>
    <div class="divider">或</div>
    <div class="social"><button>🐙 GitHub 登录（v2）</button></div>
  </div>
</div>
</body>
</html>
