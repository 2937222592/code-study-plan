<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechPath · 技术岗位学习路线图</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">
        <span class="brand-logo">🧭</span>
        <span class="brand-name">Tech<em>Path</em></span>
      </a>
      <div class="topbar-progress">
        <div class="mini-progress">
          <div class="mini-track"><div class="mini-fill" id="miniFill"></div></div>
          <span class="mini-text" id="miniText">0%</span>
        </div>
        <button class="btn-reset" id="btnReset" title="重置当前岗位进度">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          重置进度
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero 区域 -->
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow">Career Roadmap · 职业路线图</p>
        <h1>点亮你的<span class="grad" id="heroGrad">技术成长</span>之路</h1>
        <p class="hero-sub">选择技术岗位，按阶段学习并打卡每一项技能，让成长路径清晰可见。</p>
        <div class="hero-meta">
          <span class="pill" id="heroRolePill">🎨 前端开发</span>
          <span class="pill ghost">共 <b id="heroStageCount">5</b> 个阶段 · <b id="heroSkillCount">30</b> 项技能</span>
        </div>
      </div>
      <div class="hero-ring-wrap">
        <div class="ring-glow" aria-hidden="true"></div>
        <svg class="hero-ring" viewBox="0 0 140 140">
          <circle class="ring-track" cx="70" cy="70" r="60" />
          <circle class="ring-progress" id="ringProgress" cx="70" cy="70" r="60" />
        </svg>
        <div class="ring-center">
          <span class="ring-pct" id="ringPct">0%</span>
          <span class="ring-label">总进度</span>
        </div>
      </div>
    </section>

    <!-- 岗位切换 -->
    <nav class="role-nav" id="roleNav" aria-label="技术岗位切换"></nav>

    <!-- 路线图主体 -->
    <section class="roadmap" id="roadmap" aria-live="polite"></section>

    <!-- 空状态（全部完成时） -->
    <div class="all-done" id="allDone" hidden>
      <div class="all-done-badge">🏆</div>
      <h2>太棒了，全部掌握！</h2>
      <p>你已经点亮 <b id="allDoneCount">0</b> 项技能。保持手感，试着把路线里每一项都做一个小项目巩固吧。</p>
      <button class="btn-ghost" id="btnReset2">重新规划进度</button>
    </div>
  </main>

  <footer class="footer">
    <p>TechPath · 技术岗位学习路线图 —— 路线仅供参考，请结合行业趋势持续更新</p>
  </footer>

  <!-- 重置确认弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">重置当前岗位进度？</h3>
      <p id="modalDesc">将清除该岗位下所有已打卡的技能，此操作不可撤销。</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="btnCancel">取消</button>
        <button class="btn-danger" id="btnConfirm">确认重置</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
